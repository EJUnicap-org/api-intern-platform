name: Backend Integracao Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    # O Caminho A: Banco de Dados Real acoplado ao CI
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user_teste
          POSTGRES_PASSWORD: senha_falsa
          POSTGRES_DB: banco_teste
        ports:
          - 5432:5432
        # Fica testando o banco até ele estar pronto para receber conexões
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clonando o repositorio
      uses: actions/checkout@v4

    - name: Configurando Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalando dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Rodando Migracoes (Alembic) e Pytest
      env:
        # A URL aponta exatamente para o serviço que criamos ali em cima
        DATABASE_URL: "postgresql+asyncpg://user_teste:senha_falsa@localhost:5432/banco_teste"
        JWT_SECRET: "chave_falsa_para_testes"
      run: |
        alembic upgrade head
        pytest -v