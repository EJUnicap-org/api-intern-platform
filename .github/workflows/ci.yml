name: Backend Integracao Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    steps:
    - name: Clonando o repositorio
      uses: actions/checkout@v4

    - name: Configurando Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalando dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Executando Pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://postgres:senha_falsa@localhost:5432/banco_teste"
        JWT_SECRET: "s4jK3ysWC6IOz9MjKr1YVzpPRjEFRrr7xM9ioyh0Hp2toTrfHa"
        # Adicione aqui outras variáveis vitais que seu app/database.py ou config.py exijam
      run: |
        pytest -v