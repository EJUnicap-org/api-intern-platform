name: Backend Integracao Continua e Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user_teste
          POSTGRES_PASSWORD: senha_falsa
          POSTGRES_DB: banco_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Clonando o repositorio
      uses: actions/checkout@v4

    - name: Configurando Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalando dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Rodando Migracoes (Alembic) e Pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://user_teste:senha_falsa@localhost:5432/banco_teste"
        JWT_SECRET: "chave_falsa_para_testes"
      run: |
        alembic upgrade head
        pytest -v

  # =========================================================================
  # JOB 2: DEPLOY NA VPS (SÓ RODA SE OS TESTES PASSAREM E FOR NA MAIN)
  # =========================================================================
  deploy:
    name: 🚀 Deploy para Produção
    needs: testes-automatizados
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Conectar na VPS e Executar Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ejunicap/backend
            ./deploy.sh